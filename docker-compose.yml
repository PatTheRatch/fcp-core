# Postgres 16 with two databases:
#   fcp       -> DATABASE_URL
#   fcp_test  -> TEST_DATABASE_URL  (created by scripts/init-test-db.sql on first boot)
#
#   docker compose up -d
#
# The host port is configurable so this can run alongside another Postgres,
# which is the normal case on a shared host:
#
#   FCP_DB_PORT=5433 docker compose -p fcp-core up -d
#
# Whatever port you pick has to match the one in DATABASE_URL.
services:
  db:
    image: postgres:16
    # Come back after a host reboot. Without it, a kernel-update reboot on
    # 2026-09-14 left the database down overnight, and the nightly ingest and
    # backup both failed against it.
    restart: unless-stopped
    # Log every connection and disconnection with its source address, so the
    # question "did anyone get in" has an answer next time it is asked. The
    # day the database port was found open (docs/cutover.md, "Security") it
    # had none, because this was off.
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on"]
    environment:
      POSTGRES_USER: fcp
      # Read once, when the data volume is first created; a running database
      # keeps whatever its password was set to since. The VPS's was rotated
      # on 2026-09-23 and lives only in its .env.
      POSTGRES_PASSWORD: fcp
      POSTGRES_DB: fcp
    ports:
      # Loopback only. Docker publishes a bare "port:port" on every interface
      # and its own firewall rules let it through, so without the address the
      # database is on the public internet behind nothing but its password.
      # It was, on the VPS, until 2026-09-23 (docs/cutover.md, "Security").
      - "127.0.0.1:${FCP_DB_PORT:-5432}:5432"
    volumes:
      - fcp_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcp -d fcp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fcp_pgdata:
