# Local development database. Postgres 16 with two databases:
#   fcp       -> DATABASE_URL
#   fcp_test  -> TEST_DATABASE_URL  (created by scripts/init-test-db.sql on first boot)
#
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fcp
      POSTGRES_PASSWORD: fcp
      POSTGRES_DB: fcp
    ports:
      - "5432:5432"
    volumes:
      - fcp_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcp -d fcp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fcp_pgdata:
