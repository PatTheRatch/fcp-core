<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("fcp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Projections</title>
<link rel="icon" href="/pages/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pages/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/pages/static/pages.css">
</head>
<body>
<div id="shell"></div>
<div class="ws-page">

<header class="ws-head">
  <h1 class="ws-title">Projections</h1>
  <div class="ws-head-tools"><button type="button" class="ws-btn sm quiet" data-account="head-account"
    aria-haspopup="dialog">What this page is</button></div>
  <div class="ws-account" id="head-account" data-title="Projections" data-kicker="Your account"
    data-k="This page"><p>Your own projections, uploaded from wherever you pay for them, for the draft
    room and the plans to work from. A set is yours: nobody else in any league reads it.</p></div>
</header>

<p class="warnline" id="failed" hidden></p>

<section class="ws-sect">
  <div class="ws-sect-head"><h2 class="ws-label">Your sets</h2><span class="ws-k" id="tag"></span></div>
  <div class="ws-panel flush">
  <div class="scroll"><table class="ws-grid">
    <thead><tr><th>Name</th><th>Season</th><th>Players</th><th>Uploaded</th>
      <th class="l">Where from</th></tr></thead>
    <tbody id="sets"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
  </table></div>
  </div>
</section>

<!-- SOURCES (sources.js): the pools for a season, and a file uploaded with a
     mapping he can fix -- the same section the draft plan page draws. -->
<div class="src-season" id="season-pick" hidden><span class="ws-field sel"><label class="sr" for="season">Season</label>
  <select class="ws-select" id="season"></select></span></div>
<div id="sources"></div>

<p class="ws-foot" id="foot"></p>

</div>
<script src="/pages/static/pages.js"></script>
<script src="/pages/static/scenario.js"></script>
<script src="/pages/static/shell.js"></script>
<script src="/pages/static/sources.js"></script>
<script>
"use strict";

/* Projections, an account page: the reader's own uploaded sets
   (/projections/sets answers with his own only), and SOURCES for a season --
   the pools he may plan on and the upload with its mapping, as on the draft
   plan page (sources.js). */

async function start() {
  startTheme();
  const stored = await drawSets();
  if (stored) await sourcesFor(stored);
}

/** Every set of his, every season: the list this page has always drawn. */
async function drawSets() {
  const sets = await get("/projections/sets");
  if (!sets.ok) {
    fail(`Your sets cannot be read: ${sets.detail}`);
    $("sets").innerHTML = "";
    return null;
  }
  $("tag").textContent = count(sets.body.length, "set");
  $("sets").innerHTML = sets.body.length
    ? sets.body
        .map(
          (s) =>
            `<tr><td class="name">${escape(s.name)}</td><td>${s.season}</td>` +
            `<td>${s.rows}</td><td>${escape(String(s.uploaded_at).slice(0, 10))}</td>` +
            `<td class="name small">${escape(s.kind === "composite" ? "a composite" : s.source_note || dash)}</td></tr>`,
        )
        .join("")
    : `<tr><td colspan="5" class="empty">None yet. Without one, the room and the plans ` +
      `work from ESPN's own projections.</td></tr>`;
  $("foot").innerHTML = `Refreshed at <b>${clock()}</b>.`;
  return sets.body;
}

/** SOURCES for the newest season of his leagues (or of his sets), with the
 *  others a select away. */
async function sourcesFor(stored) {
  const leagues = await get("/leagues", { quiet: true });
  const seasons = new Set(stored.map((s) => s.season));
  (leagues.ok ? leagues.body : []).forEach((row) => (row.seasons || []).forEach((s) => seasons.add(s)));
  const listed = [...seasons].sort((a, b) => b - a);
  const asked = Number(new URLSearchParams(window.location.search).get("season"));
  const season = listed.includes(asked) ? asked : listed[0] || new Date().getFullYear() + 1;
  if (listed.length > 1) {
    $("season-pick").hidden = false;
    $("season").innerHTML = listed.map((s) => `<option${s === season ? " selected" : ""}>${s}</option>`).join("");
    $("season").onchange = () => window.location.assign(`?season=${$("season").value}`);
  }
  await SOURCES.mount({ host: $("sources"), season, current: null, choose: null, onChanged: () => drawSets() });
}

start();
</script>
</body>
</html>
