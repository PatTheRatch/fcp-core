<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("fcp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/pages/static/pages.css">
</head>
<body>
<div id="shell"></div>
<div class="ws-page">

<header class="ws-head">
  <h1 class="ws-title"><span id="title">Standings</span><span id="eyebrow"></span><span
    class="ws-when" id="sub"></span></h1>
  <div class="ws-head-tools"><nav class="ws-seg years" id="years" aria-label="Seasons"></nav></div>
</header>

<p class="warnline" id="failed" hidden></p>

<main id="body" hidden>
  <section class="ws-sect">
    <div class="ws-sect-head"><h2 class="ws-label">The table</h2><span class="ws-k" id="tag">regular season</span>
      <button type="button" class="ws-btn sm quiet" data-account="table-account" aria-haspopup="dialog">How this is worked out</button></div>
    <div class="ws-account" id="table-account" data-title="The table">
      <p id="lede" data-k="The order">Ranked the way the league is: on the category record. The
      category record is ESPN's own; the matchup record, which ESPN does not report for a category
      league, is counted from the stored matchups and sits in the last column. Byes count neither
      way.</p>
    </div>
    <div class="ws-seg views" id="views" role="group" aria-label="Which table" hidden>
      <button type="button" id="view-now" aria-pressed="true">As it stands</button>
      <button type="button" id="view-soon" aria-pressed="false">Projected</button>
    </div>
    <div class="ws-panel flush"><div class="scroll">
      <table class="ws-grid" id="grid">
        <thead><tr id="head"></tr></thead>
        <tbody id="table"></tbody>
      </table>
    </div></div>
  </section>
</main>

<p class="ws-foot" id="foot"></p>

</div>
<script src="/pages/static/pages.js"></script>
<script src="/pages/static/scenario.js"></script>
<script src="/pages/static/shell.js"></script>
<script>
"use strict";

/* Standings, the league's page: the standings route and the streaks route
   (each team's longest runs and the one the season ended on), joined on the
   team id. The reader's own team is shaded; a team's name opens its plan only
   where the reader may open it: his own, or every team in single mode, where
   the one user is an operator.

   The table is in the route's own order, which is the league's ranking rule
   (app/scoring/ranking.py): a head-to-head each-category league is ranked on
   its CATEGORIES -- win share, then the tied teams' record against each
   other, then categories won, then fewest lost -- so the category record and
   its share lead the row, and the matchup record, which ESPN does not report
   for this format, is the last column: a figure beside the order, never the
   order. A finished season is ESPN's own published table, and the drawer says
   where the rule would have put a team differently.

   Two views of one table. "As it stands" is what the season has decided.
   "Projected" is where it is heading (/projected, docs/projected_record.md):
   every team's remaining weeks played head to head against the real opponent
   each week, summed onto what is banked. It leads with the projected
   category record and the odds of making the playoffs, with the projected
   matchup record last; the odds of each
   individual place open under the row on a click or a tap, because fourteen
   more columns is not a table anybody can read on a phone.

   The projection is a forecast and its record travels with it: the footnote
   prints what it scored when 2026 was replayed against it. If /projected
   cannot be read -- a season with no schedule stored, or a season that is
   over -- the toggle simply does not appear and the page is what it was.

   Every column sorts on a click, the first click on a number putting the
   best value at the top, and the rank column returns the table to the
   league's own order. */

const WHERE = place();

const run = (n, word) => (isNum(n) && n > 0 ? `${n} ${word}` : dash);

/* ---- the columns ---------------------------------------------------------
   One description per column: its heading, the cell it draws, and the value
   it sorts on (`undefined` for a column that does not sort). `best` says
   which way the first click on it goes. */

function columns(view, extra) {
  const soonView = view === "soon";
  /* In the projected view the "so far" columns are the record **as it stood
     on the day the projection was made**, not the season's final one. On a
     live morning those are the same thing; on a replayed day (`?today=` a
     past day) they are not, and showing a finished season's record beside a
     projection from January would be two different questions in one row. */
  const banked = (r) => (soonView && r.soon ? r.soon.banked_matchups : null);
  /* The place is the route's own -- the league's ranking rule, or ESPN's
     published table for a finished season -- whatever column the reader has
     sorted on; the projected view's is the simulation's order. */
  const rank = {
    head: "",
    cls: "rank",
    cell: (r, i) => `<td class="rank">${!soonView && r.place ? r.place : i + 1}</td>`,
    sort: null,
  };
  const team = { head: "Team", cls: "l", cell: (r) => r.nameCell, sort: (r) => r.name, best: "up" };
  const categories = {
    head: soonView ? "Categories so far" : "Categories",
    cell: (r) =>
      soonView && r.soon
        ? `<td>${record([r.soon.banked_won, r.soon.banked_lost])}</td>`
        : `<td>${wlt(r.categories_won, r.categories_lost, r.categories_tied)}</td>`,
    sort: (r) => (soonView && r.soon ? r.soon.banked_won : r.categories_won),
    best: "down",
  };
  const matchups = {
    head: soonView ? "Matchups so far" : "Matchups",
    cell: (r) => {
      const now = banked(r);
      return now
        ? `<td class="muted">${wlt(now[0], now[1], now[2])}</td>`
        : `<td class="muted">${wlt(r.matchups_won, r.matchups_lost, r.matchups_tied)}</td>`;
    },
    sort: (r) => (banked(r) ? banked(r)[0] : r.matchups_won),
    best: "down",
  };
  if (soonView) {
    const byes = extra && extra.bye_count > 0;
    const soon = [
      {
        head: "Proj. categories",
        cell: (r) => `<td>${r.soon ? record(r.soon.projected_record) : dash}</td>`,
        sort: (r) => (r.soon ? r.soon.projected_record[0] : undefined),
        best: "down",
      },
      {
        head: "Playoffs",
        cell: (r) =>
          `<td class="odds">${r.soon
            ? `<button type="button" class="seeds" data-team="${r.espn_team_id}" ` +
              `aria-expanded="false">${pct(r.soon.playoff_odds)}</button>`
            : dash}</td>`,
        sort: (r) => (r.soon ? r.soon.playoff_odds : undefined),
        best: "down",
      },
    ];
    if (byes) {
      soon.push({
        head: "Bye",
        cell: (r) => `<td>${r.soon && isNum(r.soon.bye_odds) ? pct(r.soon.bye_odds) : dash}</td>`,
        sort: (r) => (r.soon ? r.soon.bye_odds : undefined),
        best: "down",
      });
    }
    return [
      rank,
      team,
      categories,
      ...soon,
      matchups,
      {
        head: "Proj. matchups",
        cell: (r) => `<td class="muted">${r.soon ? fixed(r.soon.projected_matchups[0], 1) + "–" +
          fixed(r.soon.projected_matchups[1], 1) : dash}</td>`,
        sort: (r) => (r.soon ? r.soon.projected_matchups[0] : undefined),
        best: "down",
      },
    ];
  }
  return [
    rank,
    team,
    categories,
    {
      head: "Cat. share",
      cell: (r) => `<td>${isNum(r.share) ? r.share.toFixed(3).replace(/^0/, "") : dash}</td>`,
      sort: (r) => r.share,
      best: "down",
    },
    {
      head: "Best run",
      cell: (r) => `<td>${r.streak ? run(r.streak.longest_win_streak, "won") : dash}</td>`,
      sort: (r) => (r.streak ? r.streak.longest_win_streak : undefined),
      best: "down",
    },
    {
      head: "Worst run",
      cell: (r) => `<td>${r.streak ? run(r.streak.longest_loss_streak, "lost") : dash}</td>`,
      sort: (r) => (r.streak ? r.streak.longest_loss_streak : undefined),
      best: "up",
    },
    { head: "Ended on", cell: (r) => `<td>${r.ended}</td>`, sort: null },
    {
      head: "Finish",
      cell: (r) => `<td>${r.final_standing ? `#${r.final_standing}` : dash}</td>`,
      sort: (r) => r.final_standing,
      best: "up",
    },
    matchups,
  ];
}

/** The seed odds for one team, as a row of bars under its own row. */
function seedsHtml(team, span, playoffs) {
  const cells = team.finishes
    .map((share, place) => {
      const made = place < playoffs;
      const height = Math.max(2, Math.round(share * 34));
      return (
        `<span class="seed${made ? " in" : ""}" title="${place + 1}: ${pct(share)}">` +
        `<i style="height:${height}px"></i><em>${place + 1}</em></span>`
      );
    })
    .join("");
  return (
    `<tr class="sub seedrow" data-for="${team.espn_team_id}"><td></td>` +
    `<td colspan="${span - 1}"><div class="seeds-bar">${cells}</div>` +
    `<p class="note">Where ${escape(team.name)} finishes, first place on the left; ` +
    `the shaded places make the playoffs.</p></td></tr>`
  );
}

/* ---- drawing -------------------------------------------------------------
   The rows are prepared once (names, shares, streaks, the projection joined
   on the team id) and then only ordered and rendered, so a sort or a switch
   of view re-reads nothing. */

const STATE = { rows: [], view: "now", sort: null, projection: null, open: new Set() };

function prepare(ctx, standings, streaks, projection) {
  const runs = new Map((streaks || []).map((s) => [s.espn_team_id, s]));
  const soon = new Map(((projection && projection.teams) || []).map((t) => [t.espn_team_id, t]));
  const ours = ctx && ctx.myTeam && ctx.myTeam.season === WHERE.season
    ? ctx.myTeam.espn_team_id : null;
  const opens = (id) => (ctx && ctx.mode === "single") || id === ours;
  return standings.map((row) => {
    const streak = runs.get(row.espn_team_id);
    return {
      ...row,
      streak,
      soon: soon.get(row.espn_team_id) || null,
      ours: row.espn_team_id === ours,
      // The route's own share, a tie counted half: (W + T/2) / (W + L + T).
      share: isNum(row.share) ? row.share : undefined,
      ended: streak && streak.final_streak_result
        ? `${streak.final_streak_result === "WIN" ? "W" : "L"}${streak.final_streak}` : dash,
      nameCell: `<td class="name">${opens(row.espn_team_id)
        ? `<a href="${teamUrl(WHERE.league, WHERE.season, row.espn_team_id, "week")}">` +
          `${escape(row.name)}</a>`
        : escape(row.name)}</td>`,
    };
  });
}

function ordered(cols) {
  const rows = STATE.rows.slice();
  if (STATE.sort === null) {
    // The projected view's own order is the API's, which is where the
    // simulation put each team; the page never re-sorts a projection into
    // the order of a season that has not been played.
    if (STATE.view === "soon" && STATE.projection) {
      const at = new Map(STATE.projection.teams.map((t, i) => [t.espn_team_id, i]));
      return rows.sort(
        (a, b) => (at.get(a.espn_team_id) ?? 99) - (at.get(b.espn_team_id) ?? 99),
      );
    }
    return rows;
  }
  const column = cols[STATE.sort.at];
  if (!column || !column.sort) return rows;
  const sign = STATE.sort.down ? -1 : 1;
  return rows.sort((a, b) => {
    const x = column.sort(a);
    const y = column.sort(b);
    if (x === y) return 0;
    if (x === undefined || x === null) return 1;
    if (y === undefined || y === null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sign;
  });
}

function draw() {
  const cols = columns(STATE.view, STATE.projection);
  const playoffs = STATE.projection ? STATE.projection.playoff_team_count : 0;
  $("head").innerHTML = cols
    .map((column, at) => {
      const on = STATE.sort && STATE.sort.at === at;
      const arrow = on ? (STATE.sort.down ? " ▾" : " ▴") : "";
      const inner = column.sort
        ? `<button type="button" data-col="${at}">${escape(column.head)}${arrow}</button>`
        : escape(column.head);
      return `<th class="${column.cls || ""}">${inner}</th>`;
    })
    .join("");
  const body = [];
  ordered(cols).forEach((row, i) => {
    body.push(
      `<tr class="${row.ours ? "ours" : ""}">` + cols.map((c) => c.cell(row, i)).join("") + "</tr>",
    );
    if (STATE.view === "soon" && row.soon && STATE.open.has(row.espn_team_id)) {
      body.push(seedsHtml(row.soon, cols.length, playoffs));
    }
  });
  $("table").innerHTML = body.join("");
}

function wireTable() {
  $("grid").addEventListener("click", (event) => {
    const head = event.target.closest("th button[data-col]");
    if (head) {
      const at = Number(head.dataset.col);
      const cols = columns(STATE.view, STATE.projection);
      const best = cols[at] && cols[at].best === "down";
      STATE.sort =
        STATE.sort && STATE.sort.at === at ? { at, down: !STATE.sort.down } : { at, down: best };
      draw();
      return;
    }
    const seeds = event.target.closest("button.seeds");
    if (seeds) {
      const id = Number(seeds.dataset.team);
      if (STATE.open.has(id)) STATE.open.delete(id);
      else STATE.open.add(id);
      draw();
    }
  });
  const buttons = { now: $("view-now"), soon: $("view-soon") };
  Object.entries(buttons).forEach(([view, button]) => {
    button.addEventListener("click", () => {
      STATE.view = view;
      STATE.sort = null;
      Object.entries(buttons).forEach(([which, other]) =>
        other.setAttribute("aria-pressed", String(which === view)),
      );
      $("tag").textContent = view === "soon" ? "projected" : "regular season";
      $("lede").innerHTML = view === "soon" ? projectedLede() : nowLede();
      draw();
    });
  });
}

/** The order in the route's own words, and where ESPN's published table and
    the rule part company (2023's second and third: a division leader seeded
    first). */
function nowLede() {
  const rows = STATE.rows;
  const first = rows[0];
  const unit = first ? first.unit : "categories";
  const order = first && first.order_note ? first.order_note : "category win share";
  const differs = rows.filter((r) => r.place_note);
  const matchupsLine = unit === "categories"
    ? "The category record is ESPN's own. The matchup record, which ESPN does not report for " +
      "a category league, is counted from the stored matchups and sits in the last column: a " +
      "figure beside the order, not the order."
    : "This league is ranked on matchups; the category record is ESPN's own.";
  return (
    `Ranked on <b>${escape(unit)}</b>: ${escape(order)}. Cat. share is ` +
    `(won + tied/2) / (won + lost + tied). ${matchupsLine} Byes count neither way.` +
    (differs.length
      ? `<br><br>Where ESPN's published order differs from the share order: ` +
        differs.map((r) => `${escape(r.place_note)}.`).join(" ")
      : "")
  );
}

function projectedLede() {
  const p = STATE.projection;
  if (!p) return nowLede();
  return (
    `Where the season is heading, from the rosters as they stand on day <b>${p.as_of}</b>` +
    (p.as_of_date ? ` (${dayName(p.as_of_date)})` : "") +
    `: each of the <b>${count(p.periods.length, "week")}</b> left played head to head against ` +
    `the real opponent, added to what is banked. Tap a playoff figure for the odds of each ` +
    `place. Each simulated table is ranked by ${escape(p.tiebreak)}; the projected matchups ` +
    `are the last column, a figure beside the order.`
  );
}

async function start() {
  startTheme();
  const base = `/leagues/${WHERE.league}/seasons/${WHERE.season}`;
  // The projection is the slow one -- it plays out every team's remaining
  // weeks, and takes seconds when the morning has not stored one -- so the
  // table is drawn without waiting for it and the view appears when it
  // lands. A page that waited would be blank for the whole build.
  const asked = get(`${base}/projected${params(WHERE)}`, { quiet: true });
  const [standings, streaks, ctx] = await Promise.all([
    get(`${base}/standings`),
    get(`${base}/streaks`),
    SHELL,
  ]);
  document.title = `Standings · ${leagueName(ctx, WHERE.league)}`;
  $("eyebrow").textContent = ` · ${WHERE.season}`;
  $("years").innerHTML = seasonLinks(ctx, WHERE);
  if (!standings.ok) {
    fail(`The standings cannot be read: ${standings.detail}`);
    $("foot").innerHTML = `Refreshed at <b>${clock()}</b>.`;
    return;
  }
  const rows = standings.body;
  const played = rows.some((r) => r.matchups_won + r.matchups_lost + r.matchups_tied > 0);
  const unit = rows.length ? rows[0].unit : "categories";
  $("sub").innerHTML = played
    ? `${count(rows.length, "team")}. The regular season, ranked on ${escape(unit)}.`
    : `${count(rows.length, "team")}, and no matchup decided yet this season.`;
  STATE.rows = prepare(ctx, rows, streaks.ok ? streaks.body : [], null);
  $("lede").innerHTML = nowLede();
  draw();
  wireTable();
  const FOOT =
    `Refreshed at <b>${clock()}</b>. Read-only. The runs are of matchups: a tie breaks one ` +
    `rather than extending it, so "5 won" is five wins in a row.` +
    (streaks.ok ? "" : `<br>No runs: ${escape(streaks.detail)}.`);
  $("foot").innerHTML = FOOT;
  $("body").hidden = false;

  const projection = await asked;
  if (!projection.ok) return;
  if (projection.body.readiness && !projection.body.readiness.ready) {
    // Before the draft there is no projection to offer a view of; the foot
    // says why in the route's own words and the table stays as it stands.
    $("foot").innerHTML = `${FOOT}<br>${escape(projection.body.readiness.note)}`;
    return;
  }
  STATE.projection = projection.body;
  STATE.rows = prepare(ctx, rows, streaks.ok ? streaks.body : [], STATE.projection);
  $("views").hidden = false;
  draw();
  $("foot").innerHTML =
    FOOT +
    `<br>The projection is a forecast, built on day <b>${STATE.projection.as_of}</b> from ` +
    `${escape(STATE.projection.source_note)}. ` +
    `${escape(STATE.projection.playoff_note || "")}` +
    `<br>${escape(STATE.projection.calibration_note)}`;
}

start();
</script>
</body>
</html>
