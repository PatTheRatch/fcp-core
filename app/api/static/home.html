<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("fcp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>{{brand}}</title>
<link rel="icon" href="/pages/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pages/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/pages/static/pages.css">
</head>
<body>
<div id="shell"></div>
<div class="page">

<header class="mast">
  <p class="eyebrow">{{brand}}</p>
  <h1 id="title">Opening your league…</h1>
  <p class="sub" id="sub"></p>
</header>

<section id="none" hidden>
  <div class="shead"><h2>No league yet</h2></div>
  <p class="lede">A league comes in one of two ways. If a member of yours has connected it,
    open the invite link he sent you: it brings you straight in. If nobody has, connect it
    yourself with your ESPN login on <a href="/account/connections">Connections</a>, and
    invite the rest from there.</p>
</section>

</div>
<script src="/pages/static/pages.js"></script>
<script src="/pages/static/scenario.js"></script>
<script src="/pages/static/shell.js"></script>
<script>
"use strict";

/* `/` for someone signed in: the shell has already chosen his default
   league (the one this browser last looked at, else his first) and its
   newest season, and the team he manages there (his verified claim, or in
   single mode the team the context route calls ours). So this page only
   goes on: to that team's Overview, or with no team to the league's This
   week, or it says there is no league yet. `replace`, so Back does not come
   here again. */

/** Where `/` goes for this viewer, from what the shell found. */
function homeFor(ctx) {
  if (!ctx || !ctx.league || !ctx.season) return null;
  if (ctx.myTeam) {
    return teamUrl(ctx.league.id, ctx.myTeam.season, ctx.myTeam.espn_team_id, "overview");
  }
  return leagueUrl(ctx.league.id, ctx.season, "week");
}

async function start() {
  startTheme();
  const ctx = await SHELL;
  const next = homeFor(ctx);
  if (next) {
    window.location.replace(next);
    return;
  }
  $("title").textContent = "Welcome";
  $("sub").innerHTML = ctx ? `Signed in as <b>${escape(ctx.me.email)}</b>.` : "";
  $("none").hidden = false;
}

start();
</script>
</body>
</html>
