<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Court Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/pages/static/pages.css">
</head>
<body>
<div id="shell"></div>
<div class="page">

<header class="mast">
  <p class="eyebrow">Full Court Press</p>
  <h1 id="title">Opening your league…</h1>
  <p class="sub" id="sub"></p>
</header>

<section id="none" hidden>
  <div class="shead"><h2>No league yet</h2></div>
  <p class="lede">A league comes in one of two ways. If a member of yours has connected it,
    open the invite link he sent you: it brings you straight in. If nobody has, connect it
    yourself with your ESPN login on <a href="/account/connections">Connections</a>, and
    invite the rest from there.</p>
</section>

</div>
<script src="/pages/static/pages.js"></script>
<script src="/pages/static/shell.js"></script>
<script>
"use strict";

/* `/` for someone signed in: the shell has already chosen his default
   league (the one this browser last looked at, else his first) and its
   newest season, so this page only goes there -- to This week -- or says
   there is no league yet. `replace`, so Back does not come here again. */

async function start() {
  startTheme();
  const ctx = await SHELL;
  if (ctx && ctx.league && ctx.season) {
    window.location.replace(leagueUrl(ctx.league.id, ctx.season, "week"));
    return;
  }
  $("title").textContent = "Welcome";
  $("sub").innerHTML = ctx ? `Signed in as <b>${escape(ctx.me.email)}</b>.` : "";
  $("none").hidden = false;
}

start();
</script>
</body>
</html>
