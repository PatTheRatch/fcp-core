<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("fcp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Claim a Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/pages/static/pages.css">
</head>
<body>
<div id="shell"></div>
<div class="page">

<header class="mast">
  <p class="eyebrow" id="eyebrow">{{brand}}</p>
  <h1>Claim your team</h1>
  <p class="sub">Your team's plan opens once your claim is verified: at once if you have
    added your ESPN SWID on <a href="/account/connections">Connections</a> and it owns the
    team, otherwise when the league's owner approves it.</p>
  <p class="sub" id="said" hidden></p>
</header>

<section><div id="teams"><p class="empty">Loading…</p></div></section>

</div>
<script src="/pages/static/pages.js"></script>
<script src="/pages/static/shell.js"></script>
<script>
"use strict";

/* /pages/claim/{league}/{season}: the season's teams, and a claim button on
   each one that is not already yours. Names are written as text. `$`,
   `place` and the URL helpers are pages.js's. */

const CLAIM = place();
const base = `/leagues/${CLAIM.league}/seasons/${CLAIM.season}/teams`;

const WORDS = { pending: "claimed, waiting for the league's owner", verified: "yours",
  rejected: "your claim was turned down" };

async function call(method, url) {
  const response = await fetch(url, { method, headers: { accept: "application/json" } });
  if (response.status === 401) toSignIn();
  const data = await response.json().catch(() => ({}));
  return { ok: response.ok, data, detail: typeof data.detail === "string" ? data.detail : "" };
}

async function load() {
  const got = await call("GET", `${base}/claimable`);
  const box = $("teams");
  box.replaceChildren();
  if (!got.ok) {
    box.append(Object.assign(document.createElement("p"), { className: "lede", textContent: got.detail }));
    return;
  }
  for (const team of got.data) {
    const line = Object.assign(document.createElement("p"), { className: "lede" });
    const name = Object.assign(document.createElement("b"), { textContent: team.name });
    const state = team.mine ? WORDS[team.mine] : team.claimed ? "has a verified manager" : "";
    line.append(name, state ? ` · ${state} ` : " ");
    if (team.mine === "verified") {
      const week = teamUrl(CLAIM.league, CLAIM.season, team.espn_team_id, "week");
      line.append(Object.assign(document.createElement("a"), { href: week, textContent: "this week" }));
    } else if (team.mine !== "pending") {
      const claim = Object.assign(document.createElement("button"), {
        className: "btn", type: "button", textContent: "Claim",
      });
      claim.onclick = async () => {
        const done = await call("POST", `${base}/${team.espn_team_id}/claim`);
        $("said").textContent = done.ok ? `${team.name}: ${WORDS[done.data.state]}.` : done.detail;
        $("said").hidden = false;
        load();
      };
      line.append(claim);
    }
    box.append(line);
  }
}

startTheme();
SHELL.then((ctx) => {
  $("eyebrow").textContent = `${leagueName(ctx, CLAIM.league)} · ${CLAIM.season}`;
});
load();
</script>
</body>
</html>
