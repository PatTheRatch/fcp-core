[project]
name = "fcp-core"
version = "0.1.0"
description = "Full Court Press backend: fantasy basketball intelligence platform (greenfield rebuild)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "espn-api>=0.30",
]

[project.optional-dependencies]
# The live draft room reads the draft page in a headless browser, because
# ESPN's read API carries none of a draft's picks until it is over. Install
# with `pip install -e '.[live]' && playwright install chromium`. Everything
# else works without it; the room falls back to typed entry.
live = [
    "playwright>=1.47",
]
# Basketball Monster exports are legacy .xls; xlrd is the one reader for those
# and only app/draft/bbm.py imports it.
projections = [
    "xlrd>=2.0",
]
# The exact solver (app/draft/exact.py): the gap check in scripts/milp_gap.py
# and the target builder in scripts/soft_targets.py. Nothing the room needs
# on the night imports it.
opt = [
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "httpx2>=0.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The report generator writes typography, not code: en dashes in "13–6", a
# real minus sign in the nine-cat formula, curly apostrophes in prose. Ruff
# flags those as ambiguous characters, which is exactly what they are not here.
"scripts/season_report.py" = ["RUF001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "espn_api.*"
ignore_missing_imports = true
