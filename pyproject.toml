[project]
name = "fcp-core"
version = "0.1.0"
description = "Full Court Press backend: fantasy basketball intelligence platform (greenfield rebuild)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Starlette parses multipart bodies through this; without it the
    # projection upload routes (app/api/projections.py) cannot be defined at
    # all, so it is a hard dependency rather than an extra.
    "python-multipart>=0.0.9",
    # Off-site backups to S3 (scripts/offsite_backup.py).
    "boto3>=1.34",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "espn-api>=0.30",
    # Fernet, for the secrets kept at rest: a league connection's ESPN
    # cookies and a member's SWID (app/secrets_box.py, docs/accounts.md).
    "cryptography>=43",
]

[project.optional-dependencies]
# The live draft room reads the draft page in a headless browser, because
# ESPN's read API carries none of a draft's picks until it is over. Install
# with `pip install -e '.[live]' && playwright install chromium`. Everything
# else works without it; the room falls back to typed entry.
live = [
    "playwright>=1.47",
]
# Reading projection files. Basketball Monster exports are legacy .xls, which
# xlrd is the one reader for; an uploaded set (app/projections/upload.py) may
# also arrive as .xlsx, which openpyxl reads. Both are imported inside the
# reader that needs them, so a CSV upload needs neither.
projections = [
    "xlrd>=2.0",
    "openpyxl>=3.1",
]
# The exact solver (app/draft/exact.py): the gap check in scripts/milp_gap.py
# and the target builder in scripts/soft_targets.py. Nothing the room needs
# on the night imports it.
opt = [
    "scipy>=1.11",
]
# Reading the NBA's official injury reports (app/injury_reports.py,
# docs/injuries.md), which are PDFs. Pure Python, so the server needs no Java
# runtime; imported inside the parser, so the accessor `app/injuries.py` and
# everything that reads the stored rows works without it.
injuries = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.0",
    "httpx2>=0.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The report generator writes typography, not code: en dashes in "13–6", a
# real minus sign in the nine-cat formula, curly apostrophes in prose. Ruff
# flags those as ambiguous characters, which is exactly what they are not here.
"scripts/season_report.py" = ["RUF001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "espn_api.*"
ignore_missing_imports = true
